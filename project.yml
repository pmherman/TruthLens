name: TruthLens
options:
  bundleIdPrefix: com.truthlens
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  TruthLensCore:
    path: .
targets:
  TruthLens:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    dependencies:
      - package: TruthLensCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.truthlens.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: TruthLens
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U29CM49JZA
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/TruthLens.entitlements
        ENABLE_HARDENED_RUNTIME: YES
